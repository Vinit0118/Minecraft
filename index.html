  id:"p1", title:"1. Simple Reflex Agent — Vacuum Cleaner World",
  tag:"Condition-action rules · rational behaviour",
  concepts:"An agent is anything that perceives its environment through sensors and acts through actuators. Here the \"sensors\" are simply knowing which square the agent is in and whether it's dirty, and the \"actuator\" is the action string the agent returns. A simple reflex agent is the weakest design in the agent hierarchy (below model-based, goal-based, utility-based): it keeps no memory of the past and no internal model of the world — it looks only at the current percept (location + status) and matches it against a fixed, hard-coded set of condition-action rules. The vacuum world is deliberately tiny (2 locations) so that reflex rules alone are enough to solve it completely. \"Rational\" here doesn't mean clever — it means this particular rule set happens to maximise the performance measure (clean squares, penalised for wasted movement) for this specific environment, with zero memory or planning required.",
  working:["simple_reflex_agent(location, status) is a pure function: it takes the two percept values and returns an action string only — it never prints or changes anything itself. This separation means the agent's \"brain\" is logically independent of the world it acts in.",
    "run_environment() owns the actual world state: environment = {'A':'Dirty','B':'Dirty'} plus a location pointer. Each loop pass does three things in order — read status = environment[location] (the agent perceiving), call the agent function to decide an action, then apply that action back onto the environment dict (the agent acting).",
    "The if/elif chain after the decision turns the abstract action string into a concrete state change: 'Suck' flips the current cell to 'Clean'; 'Move Right' / 'Move Left' just reassigns location — nothing else in the dict changes on a move.",
    "After every step, a small scan over environment.values() checks whether everything is now 'Clean'. If so, it prints the completion message and break exits the for loop immediately — which is why range(6) almost never actually runs all 6 iterations; it's just a safe ceiling."],

    if status == 'Dirty':
        return 'Suck'
    elif location == 'A':
        return 'Move Right'
    else:
        return 'Move Left'

def run_environment():
    environment = {'A': 'Dirty', 'B': 'Dirty'}
    location = 'A'
    print("Initial Environment:", environment)
    print()

        status = environment[location]
        action = simple_reflex_agent(location, status)

  concepts:"State space search means defining a problem as all possible configurations (states) and finding a sequence of legal moves from the initial state to the goal state. Tower of Hanoi is the classic teaching example because its state space can be searched not by exploring it explicitly, but by recursion that mirrors divide-and-conquer: solving \"move N disks\" is defined entirely in terms of the smaller subproblem \"move N-1 disks\" — there is no separate algorithm for the big case, only a recursive restatement of it in terms of itself. The recursion tree produces exactly 2^N − 1 printed moves because every call for n>1 spawns exactly two further recursive calls plus one directly printed move, and this branching factor is what makes the problem exponential rather than linear.",
  working:["Each call to tower_of_hanoi(n, source, destination, auxiliary) performs exactly three actions in order: recurse on n-1 disks moving source→auxiliary (using destination as the temporary holding peg), print the direct move of disk n from source→destination, then recurse on n-1 disks moving auxiliary→destination (now using source as the temporary peg).",

    print("Move disk", n, "from", source, "to", destination)

{
  id:"p3", title:"3. Sudoku Solver — Backtracking & Constraint Propagation",
  tag:"CSP · pruning · backtracking",
  concepts:"This is a Constraint Satisfaction Problem solved by depth-first search with pruning. Variables are the 81 cells, domains are the digits 1–9, and constraints require each row, column, and 3×3 box to contain every digit exactly once. The board is one single shared mutable list passed by reference through every recursive call — this is essential, not incidental: all calls read and write the same board object, so a digit placed deep inside the recursion is instantly visible to every other call, and undoing it (setting the cell back to 0) is equally instant and global. This shared-mutable-state design is what makes simple backtracking possible without having to copy and return a new board at every step.",
  working:["solve(board) scans the grid row by row, column by column, looking for the first cell still equal to 0. If no such cell exists, every cell already holds a valid digit, so it returns True immediately — this is the \"success\" signal that will get passed back up through every pending recursive call on the stack.",
    "For that one empty cell, it tries digits 1 through 9 in order. For each candidate it calls is_valid(board,row,col,num), which checks three independent regions — the full row, the full column, and the 3×3 box (computed from start_row = 3*(row//3) and start_col = 3*(col//3)) — and the digit is only accepted if it is absent from all three.",
    "If a digit is valid, the code tentatively places it and recurses — effectively saying \"assume this is correct, now go solve everything that remains.\" If that recursive call eventually returns True, the entire call chain returns True without ever touching this cell again.",
    "If the recursive call instead returns False, the digit is undone (board[row][col] = 0) and the loop moves on to try the next digit — this undo-then-retry step is literally what the word \"backtracking\" refers to.",
    "If all nine digits fail for a cell, the function returns False, which forces whichever call placed the previous digit (one level up the stack) to also undo its choice and try its own next option — failure propagates backward exactly one placement at a time, which is why a single wrong early guess can cause a long chain of undo operations before the solver recovers."],
  code:`def is_valid(board, row, col, num):
    for c in range(9):
        if board[row][c] == num:
            return False
    for r in range(9):
        if board[r][col] == num:
            return False
    start_row = 3 * (row // 3)
    start_col = 3 * (col // 3)
    for r in range(start_row, start_row + 3):
        for c in range(start_col, start_col + 3):
            if board[r][c] == num:
                return False
    return True

def solve(board):
    for row in range(9):
        for col in range(9):
            if board[row][col] == 0:
                for num in range(1, 10):
                    if is_valid(board, row, col, num):
                        board[row][col] = num

                        board[row][col] = 0

  known:[["Why start_row = 3 * (row // 3) and not just row // 3?","row // 3 gives the box index (0,1,2), not the actual starting row — multiplying by 3 converts it back."],

{
  id:"p4", title:"4. A* Search — 8 Puzzle Problem",
  tag:"f(n)=g(n)+h(n) · Manhattan distance · heapq",
  concepts:"A* is best-first search guided by the formula f(n)=g(n)+h(n), where g(n) is the actual cost already paid to reach state n, and h(n) is an estimate of the remaining cost to the goal. What distinguishes it from plain cost-based search (like Dijkstra) is that admissible heuristic h(n) — one that never overestimates the true remaining cost — which lets A* skip exploring states that provably can't beat the current best path, without ever sacrificing the guarantee of finding the optimal solution. Manhattan distance (sum of horizontal + vertical tile displacements) is used here specifically because it is provably admissible for the 8-puzzle: tiles can only move orthogonally, never diagonally, so this distance can never overstate the true number of moves needed.",
  working:["States are represented as 3×3 tuples-of-tuples rather than lists specifically because tuples are immutable and hashable — this lets them be stored directly inside the closed set and compared for equality in O(1), which a list could never do.",
    "open_list is a binary heap of (f, g, state, path) tuples. heapq.heappop always returns the tuple with the smallest first element (f); if two tuples tie on f, Python compares the next element (g) to break the tie, preferring the state that made more concrete progress.",
    "Main loop: pop the best-ranked state. If it equals goal_state, the search is over — g at that point is exactly the number of moves made. Otherwise, if this exact state is already in closed, it's skipped outright (this is called lazy deletion — stale duplicate heap entries for an already-explored state are simply ignored rather than physically removed from the heap, which heapq doesn't support efficiently anyway).",
    "Otherwise the state is marked explored and get_neighbors generates its up-to-4 neighbours purely by locating the blank tile (0) and swapping it with each in-bounds adjacent cell — this single operation naturally encodes all legal 8-puzzle moves (sliding a tile into the blank is the same as swapping blank with that tile).",
    "For every neighbour not already closed: new_g = g+1 (exactly one more move than the parent), new_h = manhattan_distance(neighbor, goal), and the triple (new_g+new_h, new_g, neighbor, path+[neighbor]) is pushed back onto the heap. path+[neighbor] builds a brand-new list rather than mutating the old one, which is what allows many different heap entries to safely carry independent route histories without corrupting each other's paths."],
  code:`import heapq

def manhattan_distance(state, goal):
    total = 0
    for i in range(3):
        for j in range(3):
            value = state[i][j]
            if value != 0:
                for gi in range(3):
                    for gj in range(3):
                        if goal[gi][gj] == value:
                            total = total + abs(i - gi) + abs(j - gj)
    return total

def get_neighbors(state):
    neighbors = []
    state_list = [list(row) for row in state]
    blank_r = blank_c = 0
    for i in range(3):
        for j in range(3):
            if state_list[i][j] == 0:
                blank_r, blank_c = i, j
    moves = [(-1, 0), (1, 0), (0, -1), (0, 1)]
    for dr, dc in moves:
        new_r, new_c = blank_r + dr, blank_c + dc
        if 0 <= new_r < 3 and 0 <= new_c < 3:
            new_state = [row[:] for row in state_list]
            new_state[blank_r][blank_c], new_state[new_r][new_c] = \\
                new_state[new_r][new_c], new_state[blank_r][blank_c]
            neighbors.append(tuple(tuple(row) for row in new_state))
    return neighbors

def a_star(start, goal):
    start_state = tuple(tuple(row) for row in start)
    goal_state = tuple(tuple(row) for row in goal)
    h = manhattan_distance(start_state, goal_state)
    open_list = []
    heapq.heappush(open_list, (h, 0, start_state, [start_state]))
    closed = set()
    while open_list:
        f, g, current, path = heapq.heappop(open_list)
        if current == goal_state:
            print("Goal reached in", g, "moves!")
            return
        if current in closed:
            continue
        closed.add(current)
        for neighbor in get_neighbors(current):
            if neighbor not in closed:
                new_g = g + 1
                new_h = manhattan_distance(neighbor, goal_state)
                heapq.heappush(open_list, (new_g + new_h, new_g, neighbor, path + [neighbor]))
    print("No solution found.")`,

  ["Why convert state to a tuple before using a set?","Sets need hashable elements; lists are mutable and unhashable, tuples aren't."]],

  mistakes:["Confusing g(n) and h(n).","Forgetting to add explored states to the closed list — causes repeated exploration.","Using a plain list instead of heapq.","Using Euclidean distance instead of Manhattan.","Not converting state to a tuple before using a set."],
  viva:[["What is A* Search?","Informed search finding the optimal path via f(n)=g(n)+h(n)."],
  ["What is an admissible heuristic?","One that never overestimates the true cost; guarantees A* finds the optimal solution."],
  ["Why Manhattan over Euclidean?","Tiles move only horizontally/vertically, never diagonally."],
  ["What is the open list?","A min-heap of discovered-but-unexplored states, ordered by f."],
  ["What is the closed list?","A set of already-explored states, never re-added to the open list."]],
  revision:["f(n) = g(n) + h(n).","g(n) = moves from start to current.","h(n) = Manhattan distance to goal.","Open list = min-heap; closed list = explored set.","Blank tile = 0; state stored as tuple so it's hashable."]
},
{

  concepts:"The agent's \"intelligence\" here is entirely its search strategy, not any learning — it maintains a shrinking interval [low, high] that is guaranteed to contain the answer, and always queries the exact midpoint of that interval. This is provably the strategy that minimises the worst-case number of guesses against an opponent who answers honestly: every guess, right or wrong, halves the number of remaining candidates, which is why the environment is classified as fully observable, deterministic, episodic, discrete, and single-agent — there is no hidden information and no randomness in how feedback is generated.",

    "The loop condition while low <= high is the actual termination guarantee — the interval shrinks by roughly half every pass, so it collapses to a single remaining candidate (low == high) within about log2(100) ≈ 7 iterations, and 'C' can only be the truthful response at or before that point.",

  code:`def agent_guesses():

    high = 100
    attempts = 0
    print("Think of a number between 1 and 100.")
    while low <= high:

        attempts = attempts + 1
        print("Attempt", attempts, ": Is your number", guess, "?")
        response = input("Your response (H / L / C): ").strip().upper()
        if response == 'C':

        elif response == 'H':

        elif response == 'L':

{
  id:"p6", title:"6. Chatbot — Predefined Rules & Pattern Matching",
  tag:"re.search · regex alternation · rule priority",
  concepts:"This is the \"good old-fashioned AI\" approach to conversation — no statistics, no training data, just a hand-written lookup table mapping regex patterns to canned responses, checked in a fixed priority order. Intelligence here is an illusion created entirely by how comprehensively the patterns list covers likely phrasings of each intent — the program itself has zero understanding of language; re.search just checks whether a substring resembling the pattern appears anywhere in the input.",
  working:["match_response() takes the user's raw text and walks the patterns list from top to bottom; the first tuple whose regex matches anywhere in the input (case-insensitively, via re.IGNORECASE) wins immediately — its response is returned right there, and every pattern listed after it is never even evaluated for that turn.",
    "If the loop finishes without any pattern matching, default_response is returned instead of None — this fallback is precisely what stops the subsequent print(\"Bot:\", response) call from ever trying to print None or crashing.",
    "chat() is a separate, independent while True loop: it keeps calling match_response() on each new line typed. After printing the bot's reply, it runs a second, completely separate re.search for the goodbye words against the raw input — this duplicate check exists purely to decide whether to break the loop, since match_response()'s only job was producing text, never controlling the conversation's flow."],
  code:`import re

patterns = [
    ('hello|hi|hey', 'Hello! Welcome to College Enquiry. How can I help you?'),
    ('timing|time|hours|open|close', 'College timings are 9:00 AM to 5:00 PM, Monday to Saturday.'),
    ('admission|admissions|enroll|enrollment|apply', 'Admissions are open from June to August.'),
    ('department|departments|course|courses|branch', 'We offer departments in CS, IT, Mechanical, Civil, and Electronics.'),
    ('bye|goodbye|exit|quit|thank', 'Thank you for visiting College Enquiry. Goodbye!'),
]
default_response = "I'm sorry, I don't have that information."

def match_response(user_input):
    for pattern, response in patterns:
        if re.search(pattern, user_input, re.IGNORECASE):
            return response
    return default_response

def chat():
    print("College Enquiry Chatbot — type 'bye' to exit.")
    while True:
        user_input = input("You: ").strip()
        if user_input == "":
            continue
        response = match_response(user_input)
        print("Bot:", response)
        if re.search('bye|goodbye|exit|quit', user_input, re.IGNORECASE):
            break

{
  id:"p7", title:"7. BFS — Robot Path Planning",
  tag:"Queue (FIFO) · shortest path guarantee",
  concepts:"BFS treats the grid as an unweighted graph where every free cell is a node connected to its up-to-4 free neighbours. Because every edge represents the exact same cost (one step), the very first time BFS reaches any given cell, it is guaranteed to have arrived there via the shortest possible route — this single fact is the entire reason BFS, rather than DFS, is the correct choice whenever an optimal (shortest) path is actually required.",
  working:["The two if-checks at the top reject an impossible task immediately — a blocked start or goal — before any of the actual search machinery (queue, visited set) is even set up.",
    "The queue holds (cell, path-so-far) pairs, seeded with the start cell and its one-element path; visited is seeded with the start too. Crucially, visited is updated at the moment a cell is enqueued, not when it's dequeued — this guarantees a given cell can never be placed into the queue twice, no matter how many different already-queued neighbours would otherwise try to reach it.",
    "Each pop takes the oldest-queued cell via popleft() (true FIFO order), checks whether it's the goal, and if not, expands its four neighbours. This strict oldest-first ordering is exactly what makes BFS explore the grid in expanding rings of distance from the start — completing one full ring of distance d before any cell at distance d+1 is even looked at.",
    "The path needs no separate reconstruction step afterwards (unlike A* with a parent-map): path + [new_cell] is carried along inside the queue entry itself the entire time, so the moment the goal cell is dequeued, its accompanying path is already the complete, correct shortest route."],
  code:`from collections import deque

def bfs_path_planning(grid, start, goal):
    rows, cols = len(grid), len(grid[0])
    if grid[start[0]][start[1]] == 1:
        print("Start cell is blocked.")
        return None
    if grid[goal[0]][goal[1]] == 1:
        print("Goal cell is blocked.")
        return None
    queue = deque()
    queue.append((start, [start]))
    visited = {start}
    moves = [(-1, 0), (1, 0), (0, -1), (0, 1)]
    while queue:
        current_cell, path = queue.popleft()
        r, c = current_cell
        if current_cell == goal:
            return path
        for dr, dc in moves:
            new_cell = (r + dr, c + dc)
            nr, nc = new_cell
            if 0 <= nr < rows and 0 <= nc < cols:
                if grid[nr][nc] == 0 and new_cell not in visited:
                    visited.add(new_cell)
                    queue.append((new_cell, path + [new_cell]))
    return None`,
  known:[["Why deque instead of a plain list?","list.pop(0) is O(n); deque.popleft() is O(1)."],
  ["Why mark visited at enqueue time, not dequeue time?","Marking only at dequeue lets the same cell be enqueued multiple times before it's processed, wasting memory and time."]],
  newq:["Why explicitly check if start or goal is blocked before the BFS loop even runs, instead of letting BFS just fail naturally?","If the start is blocked and you skip the check, the while loop simply runs zero times and returns None with zero explanation of why. The explicit check fails fast with a specific, readable message — which matters far more in a demo or viva (where the examiner wants to see you reasoned about edge cases) than in production, where the caller usually just checks for a None return."],
  mistakes:["Using a stack instead of a queue (that becomes DFS).","Not marking cells visited before enqueueing — duplicates.","Forgetting boundary checks.","Not checking if start/goal is an obstacle.","Returning the visited set instead of the actual path."],
  viva:[["What is BFS?","Explores nodes level by level using a queue."],
  ["Why does BFS guarantee shortest path?","First time the destination is reached, it's via the fewest possible steps."],
  ["Data structure?","Queue (FIFO); deque used because popleft() is O(1)."],
  ["What does deque mean?","Double-ended queue — efficient append/pop at both ends."]],
  revision:["0 = free, 1 = obstacle.","Use deque.","Queue stores (cell, path) pairs.","visited set prevents revisits.","4 moves: up/down/left/right.","Return path when goal reached, else None."]
},
{
  id:"p8", title:"8. DFS — Maze Solving",
  tag:"Recursion as stack · backtracking",
  concepts:"DFS explores the same kind of grid as BFS but the opposite way — it commits fully to one direction and only reconsiders when it provably can go no further. This implementation uses Python's own call stack via recursion rather than an explicit stack object, which is simpler to write but means the maximum maze depth DFS can handle is limited by Python's recursion limit (around 1000 by default). Unlike BFS, DFS is complete (it will find a path if one exists in a finite maze) but not optimal — it finds a valid path, not necessarily the shortest one.",
  working:["The inner function dfs(r,c) is nested inside dfs_maze and closes over the outer visited set and path list — meaning every recursive call shares exactly one visited set and one path list rather than each call getting its own private copy. This shared state is what makes the \"add on the way down, pop() on the way back up if it failed\" pattern actually work.",
    "The order of checks inside dfs matters: bounds are checked first, then wall/visited — it must rule out an out-of-range r or c before ever trying to index into maze[r][c], or Python would raise an index error.",
    "On success — the current cell equals goal — the function returns True immediately without ever calling path.pop(), so the cell stays in path permanently, and that True value propagates straight back up through every waiting caller in the recursion chain without any of them running their own pop().",
    "On a dead end — all four recursive dfs() calls for this cell returned False — the function pops its own cell off path (undoing the push made when this call started) and returns False itself. That False is exactly what signals the parent call to try its own next direction with a clean, correctly-sized path."],
  code:`def dfs_maze(maze, start, goal):
    rows, cols = len(maze), len(maze[0])
    visited = set()
    path = []

    def dfs(r, c):
        if r < 0 or r >= rows or c < 0 or c >= cols:
            return False
        if maze[r][c] == 1 or (r, c) in visited:
            return False
        visited.add((r, c))
        path.append((r, c))
        if (r, c) == goal:
            return True
        moves = [(-1, 0), (1, 0), (0, -1), (0, 1)]
        for dr, dc in moves:
            if dfs(r + dr, c + dc):
                return True
        path.pop()
        return False

    if dfs(start[0], start[1]):
        return path
    return None`,
  known:[["Why does path.pop() sit after the whole for-loop, not inside it?","It should only fire once all four directions have failed — inside the loop it would discard the cell after just one failed try."],
  ["Why mark visited before the recursive call, not after it returns?","Marking after would let the same cell be revisited before the outer call ever marks it, causing infinite recursion."]],
  newq:["Why does the fixed direction order (up, down, left, right) matter if DFS finds 'a path' either way?","DFS doesn't guarantee the shortest path — only a valid one — so the order you try directions in determines exactly which path gets found first when several exist. Swap the order and the output path can look completely different even though correctness is untouched. This explains the common confusion of 'my code is correct but my printed path doesn't match the sample output' — it's the move order, not a bug."],
  mistakes:["Forgetting path.pop() when backtracking.","Not marking visited before recursing — infinite recursion.","Using a queue instead of recursion (becomes BFS).","Forgetting boundary checks.","Not handling the no-path case (should return None)."],
  viva:[["What is DFS?","Explores as deep as possible along one branch before backtracking."],
  ["Data structure?","A stack — Last In First Out; recursion uses the call stack."],
  ["Does DFS guarantee shortest path?","No — it finds a valid path, not necessarily the shortest."],
  ["What is backtracking in DFS?","Removing the last cell and returning False when a path hits a dead end."],
  ["When use DFS over BFS?","When memory is limited, or any valid path is acceptable."]],
  revision:["0 = open, 1 = wall.","Recursive DFS uses the call stack.","visited set prevents infinite loops.","path list tracks the current route.","pop() on backtrack; return True/False."]
},
];

const nav = document.getElementById('nav');
const main = document.getElementById('main');

function addList(parent, title, items){
  const st = document.createElement('div');
  st.className = 'sectitle';
  st.textContent = title;
  parent.appendChild(st);
  const ul = document.createElement('ul');
  ul.className = 'compact';
  items.forEach(it => {
    const li = document.createElement('li');
    li.textContent = it;
    ul.appendChild(li);
  });
  parent.appendChild(ul);
}

function addViva(parent, title, items){
  const st = document.createElement('div');
  st.className = 'sectitle';
  st.textContent = title;
  parent.appendChild(st);
  items.forEach(([q,a]) => {
    const d = document.createElement('div');
    d.className = 'vivaq';
    d.innerHTML = '<b>Q: ' + q + '</b>' + a;
    parent.appendChild(d);
  });
}

  codeEl.textContent = p.code;
  pre.appendChild(codeEl);
  const btn = document.createElement('button');
  btn.className = 'copybtn';
  btn.textContent = 'Copy';
  btn.addEventListener('click', () => {

function fallbackCopy(text, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    done();
  }catch(e){
    console.error('Copy failed', e);
  }
}
